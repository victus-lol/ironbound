<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · Ironbound</title>
<script src="{{ url_for('static', filename='js/theme.js') }}?v=15"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=15">
<meta name="theme-color" content="#0b0f1a">
<meta name="color-scheme" content="dark light">
</head>
<body class="auth-body">
<div class="bg-scene" aria-hidden="true">
    <div class="bg-grid"></div>
</div>

<div class="auth-card">
    <div class="auth-header">
        <a class="auth-home" href="/" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle day / night mode" aria-label="Toggle day / night mode">
            <span class="theme-ico-sun" aria-hidden="true">☀️</span>
            <span class="theme-ico-moon" aria-hidden="true">🌙</span>
        </button>
    </div>
    <div class="auth-brand">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7 2.8v6.1c0 4.8-3.1 8.2-7 10.6-3.9-2.4-7-5.8-7-10.6V5.3z"/><path d="M12.8 7.5l-3.4 4.6h2.4l-.6 4.4 3.4-4.6h-2.4z"/></svg></span>IRONBOUND</a>
    </div>
    <div class="auth-tag">Create your character sheet</div>

    <form method="POST" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">
        <p class="field-hint">3–24 letters, numbers, or underscores.</p>
        <label for="password">Password</label>
        <div class="pw-wrap">
            <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
            <button type="button" class="pw-toggle" data-pw-target="password" aria-label="Show password">👁</button>
        </div>
        <p class="field-hint">At least 8 characters.</p>
        <label for="password_confirm">Confirm password</label>
        <div class="pw-wrap">
            <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8">
            <button type="button" class="pw-toggle" data-pw-target="password_confirm" aria-label="Show password">👁</button>
        </div>
        <label for="gender">Gender — picks the right benchmark tables for your stats</label>
        <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}
        <button class="btn btn-primary auth-submit" type="submit">Start training</button>
    </form>

    <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</div>

{% set flashes = get_flashed_messages(with_categories=true) %}
<div id="flash-data" {% if flashes %}data-messages="{{ flashes | tojson | forceescape }}"{% endif %} hidden></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="{{ url_for('static', filename='js/main.js') }}?v=15"></script>
</body>
</html>
