{% macro body_map(regions) -%}
<div class="body-map" aria-hidden="true">
    {% set on = regions %}
    <svg class="body-fig" viewBox="0 0 200 420">
        <defs>
            <linearGradient id="ib-map-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--cyan)"/>
                <stop offset="1" stop-color="var(--violet)"/>
            </linearGradient>
        </defs>
        <!-- front -->
        <circle cx="100" cy="26" r="20" class="body-part"/>
        <rect x="91" y="44" width="18" height="16" rx="4" class="body-part"/>
        <path d="M66 60 L134 60 L142 92 L138 116 L132 150 L68 150 L62 116 L58 92 Z" class="body-part"/>
        <rect x="78" y="150" width="44" height="12" rx="6" class="body-part"/>
        <circle cx="55" cy="228" r="7" class="body-part"/>
        <circle cx="145" cy="228" r="7" class="body-part"/>
        <circle cx="78" cy="250" r="10" class="body-part"/>
        <circle cx="122" cy="250" r="10" class="body-part"/>
        <path d="M62 332 h28 v12 h-28 z" class="body-part"/>
        <path d="M110 332 h28 v12 h-28 z" class="body-part"/>
        <!-- highlightable regions (front) -->
        <g class="m-region m-delts {{ 'on' if 'delts' in on }}">
            <circle cx="64" cy="72" r="13"/><circle cx="136" cy="72" r="13"/>
        </g>
        <g class="m-region m-pecs {{ 'on' if 'pecs' in on }}">
            <rect x="66" y="60" width="33" height="38" rx="10"/><rect x="101" y="60" width="33" height="38" rx="10"/>
        </g>
        <rect class="m-region m-abs {{ 'on' if 'abs' in on }}" x="86" y="110" width="28" height="34" rx="8"/>
        <path class="m-region m-heart {{ 'on' if 'heart' in on }}" d="M100 76 C 94 62 78 64 78 78 C 78 92 100 104 100 104 C 100 104 122 92 122 78 C 122 64 106 62 100 76 Z"/>
        <g class="m-region m-biceps {{ 'on' if 'biceps' in on }}">
            <path fill="none" d="M56 78 L49 146" stroke-width="16" stroke-linecap="round"/><path fill="none" d="M144 78 L151 146" stroke-width="16" stroke-linecap="round"/>
        </g>
        <g class="m-region m-forearms {{ 'on' if 'forearms' in on }}">
            <path fill="none" d="M49 154 L54 220" stroke-width="12" stroke-linecap="round"/><path fill="none" d="M151 154 L146 220" stroke-width="12" stroke-linecap="round"/>
        </g>
        <g class="m-region m-quads {{ 'on' if 'quads' in on }}">
            <path fill="none" d="M82 158 L78 248" stroke-width="26" stroke-linecap="round"/><path fill="none" d="M118 158 L122 248" stroke-width="26" stroke-linecap="round"/>
        </g>
        <g class="m-region m-calves {{ 'on' if 'calves' in on }}">
            <path fill="none" d="M78 256 L74 326" stroke-width="15" stroke-linecap="round"/><path fill="none" d="M122 256 L126 326" stroke-width="15" stroke-linecap="round"/>
        </g>
    </svg>
    <svg class="body-fig" viewBox="0 0 200 420">
        <!-- back -->
        <circle cx="100" cy="26" r="20" class="body-part"/>
        <rect x="91" y="44" width="18" height="16" rx="4" class="body-part"/>
        <path d="M66 60 L134 60 L142 92 L138 116 L132 150 L68 150 L62 116 L58 92 Z" class="body-part"/>
        <rect x="78" y="150" width="44" height="12" rx="6" class="body-part"/>
        <circle cx="55" cy="228" r="7" class="body-part"/>
        <circle cx="145" cy="228" r="7" class="body-part"/>
        <circle cx="78" cy="250" r="10" class="body-part"/>
        <circle cx="122" cy="250" r="10" class="body-part"/>
        <path d="M62 332 h28 v12 h-28 z" class="body-part"/>
        <path d="M110 332 h28 v12 h-28 z" class="body-part"/>
        <!-- highlightable regions (back) -->
        <g class="m-region m-delts {{ 'on' if 'delts' in on }}">
            <circle cx="64" cy="72" r="13"/><circle cx="136" cy="72" r="13"/>
        </g>
        <g class="m-region m-traps {{ 'on' if 'traps' in on }}">
            <path d="M84 58 L66 70 L74 88 L90 82 Z"/><path d="M116 58 L134 70 L126 88 L110 82 Z"/>
        </g>
        <g class="m-region m-lats {{ 'on' if 'lats' in on }}">
            <path d="M66 72 L92 88 L94 120 L68 118 Z"/><path d="M134 72 L108 88 L106 120 L132 118 Z"/>
        </g>
        <rect class="m-region m-lowerback {{ 'on' if 'lowerback' in on }}" x="92" y="106" width="16" height="44" rx="6"/>
        <g class="m-region m-triceps {{ 'on' if 'triceps' in on }}">
            <path fill="none" d="M56 78 L49 146" stroke-width="16" stroke-linecap="round"/><path fill="none" d="M144 78 L151 146" stroke-width="16" stroke-linecap="round"/>
        </g>
        <g class="m-region m-forearms {{ 'on' if 'forearms' in on }}">
            <path fill="none" d="M49 154 L54 220" stroke-width="12" stroke-linecap="round"/><path fill="none" d="M151 154 L146 220" stroke-width="12" stroke-linecap="round"/>
        </g>
        <path class="m-region m-glutes {{ 'on' if 'glutes' in on }}" d="M80 152 h40 v16 a20 20 0 0 1 -40 0 Z"/>
        <g class="m-region m-hamstrings {{ 'on' if 'hamstrings' in on }}">
            <path fill="none" d="M82 180 L78 248" stroke-width="26" stroke-linecap="round"/><path fill="none" d="M118 180 L122 248" stroke-width="26" stroke-linecap="round"/>
        </g>
        <g class="m-region m-calves {{ 'on' if 'calves' in on }}">
            <path fill="none" d="M78 256 L74 326" stroke-width="15" stroke-linecap="round"/><path fill="none" d="M122 256 L126 326" stroke-width="15" stroke-linecap="round"/>
        </g>
    </svg>
</div>
{%- endmacro %}
