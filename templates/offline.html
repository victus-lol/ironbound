<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Ironbound</title>
<script src="{{ url_for('static', filename='js/theme.js') }}?v=15"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=15">
<meta name="theme-color" content="#0b0f1a">
<meta name="color-scheme" content="dark light">
</head>
<body class="auth-body">
<div class="bg-scene" aria-hidden="true">
    <div class="bg-grid"></div>
</div>

<button class="icon-btn theme-toggle theme-toggle-fixed" id="themeToggle" type="button" title="Toggle day / night mode" aria-label="Toggle day / night mode">
    <span class="theme-ico-sun" aria-hidden="true">☀️</span>
    <span class="theme-ico-moon" aria-hidden="true">🌙</span>
</button>

<div class="auth-card" style="text-align:center;">
    <div class="auth-brand">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7 2.8v6.1c0 4.8-3.1 8.2-7 10.6-3.9-2.4-7-5.8-7-10.6V5.3z"/><path d="M12.8 7.5l-3.4 4.6h2.4l-.6 4.4 3.4-4.6h-2.4z"/></svg></span>IRONBOUND</a>
    </div>
    <div class="empty">
        <div class="big">📡</div>
        <h3>You're offline</h3>
        <p>Reconnect and everything will be back — your logs live on the server, so nothing is lost. The app shell below is cached so you can still get back in fast.</p>
    </div>
    <div class="actions" style="justify-content:center;">
        <a class="btn btn-primary" href="/">Try again →</a>
    </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="{{ url_for('static', filename='js/main.js') }}?v=15"></script>
</body>
</html>
